<!DOCTYPE html>
<html lang="tr" data-theme="auto">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vetting Inspector</title>
    <meta name="description" content="SIRE 2.0 preparation by rank with Torlak SQEMS procedures — checklist, interview practice and exam. Works offline.">
